<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Utah Programmer Job Market Analysis</title>
  <desc id="desc">Editorial chart thumbnail showing high, middle, and low wage-to-cost affordability for Utah programmer roles and counties. Software Developers in Carbon County lead at 2.59 times annual baseline cost; Web Developers in Weber County are at 1.34 times; QA Analysts and Testers in Cache County are at 0.93 times.</desc>
  <defs>
    <pattern id="paperGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1E2D2D" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="820" fill="#F4F0E6"/>
  <rect width="1600" height="820" fill="url(#paperGrid)"/>
  <rect x="0" y="0" width="26" height="820" fill="#B7442D"/>

  <g fill="#1E2D2D">
    <text x="112" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2">Utah Programmer</text>
    <text x="112" y="225" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-2">Job Market</text>
  </g>

  <line x1="116" y1="254" x2="550" y2="254" stroke="#B7442D" stroke-width="7"/>
  <text x="116" y="298" fill="#1E2D2D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2">WAGES × COST OF LIVING × JOB GROWTH</text>

  <g transform="translate(600 155)">
    <g stroke="#CEC7B8" stroke-width="2">
      <line x1="330" y1="106" x2="330" y2="570"/>
      <line x1="520" y1="106" x2="520" y2="570"/>
      <line x1="710" y1="106" x2="710" y2="570"/>
      <line x1="900" y1="106" x2="900" y2="570"/>
    </g>
    <line x1="520" y1="86" x2="520" y2="584" stroke="#B7442D" stroke-width="5" stroke-dasharray="12 10"/>
    <text x="532" y="101" fill="#B7442D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">BREAK-EVEN</text>

    <text x="30" y="164" fill="#1E2D2D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Software Developers</text>
    <text x="30" y="194" fill="#56645F" font-family="Arial, Helvetica, sans-serif" font-size="21">Carbon County</text>
    <rect x="330" y="130" width="492" height="94" fill="#3D7C69"/>
    <text x="838" y="191" fill="#1E2D2D" font-family="Georgia, 'Times New Roman', serif" font-size="53" font-weight="700">2.59×</text>

    <text x="30" y="314" fill="#1E2D2D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Web Developers</text>
    <text x="30" y="344" fill="#56645F" font-family="Arial, Helvetica, sans-serif" font-size="21">Weber County</text>
    <rect x="330" y="280" width="255" height="94" fill="#C69A42"/>
    <text x="601" y="341" fill="#1E2D2D" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700">1.34×</text>

    <text x="30" y="464" fill="#1E2D2D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">QA Analysts &amp; Testers</text>
    <text x="30" y="494" fill="#56645F" font-family="Arial, Helvetica, sans-serif" font-size="21">Cache County</text>
    <rect x="330" y="430" width="177" height="94" fill="#C96A42"/>
    <text x="528" y="491" fill="#1E2D2D" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="700">0.93×</text>

    <line x1="330" y1="570" x2="900" y2="570" stroke="#1E2D2D" stroke-width="3"/>
    <g fill="#56645F" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">
      <text x="330" y="611">0</text>
      <text x="520" y="611">1×</text>
      <text x="710" y="611">2×</text>
      <text x="900" y="611">3×</text>
    </g>
    <text x="615" y="645" fill="#56645F" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">ONE ADULT · NO CHILDREN</text>
  </g>
</svg>
